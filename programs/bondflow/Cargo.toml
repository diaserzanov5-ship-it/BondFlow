[package]
name = "bondflow"
version = "0.1.0"
description = "Devnet prototype for auditable bond coupon actions and claims"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bondflow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", features = ["associated_token", "token_2022"] }
